name: Render video

# Manual render from the GitHub app / mobile browser (Actions -> Render video -> Run workflow),
# plus an automatic low-res smoke render on pull requests that touch the studio.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition to render"
        type: choice
        options: [InventorWalkInPreview, InventorWalkIn, NightShift10Preview, NightShift10]
        default: InventorWalkInPreview
      stills:
        description: "Comma-separated frames to export as PNG preview stills"
        type: string
        default: "8,70,140"
      frames:
        description: "Optional frame range, e.g. 0-59 (leave blank for the whole video)"
        type: string
        default: ""
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest # free standard runner (no GPU: WebGL runs on SwiftShader via --gl=swangle)
    timeout-minutes: 45
    defaults:
      run:
        working-directory: studio
    env:
      COMP: ${{ inputs.composition || 'InventorWalkInPreview' }}
      STILLS: ${{ inputs.stills || '8,70,140' }}
      FRAMES: ${{ inputs.frames }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: System libraries for headless Chrome + fonts
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3 libgbm1 libxkbcommon0 libasound2t64 fonts-dejavu-core \
            || sudo apt-get install -y --no-install-recommends libnss3 libgbm1 libxkbcommon0 libasound2 fonts-dejavu-core

      - name: Install dependencies
        run: npm ci

      - name: Download Remotion's headless browser
        run: npx remotion browser ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Render preview stills
        run: |
          node scripts/render-stills.mjs "$COMP" out/stills "$STILLS"

      - name: Render MP4
        run: |
          RANGE=""
          if [ -n "$FRAMES" ]; then RANGE="--frames=$FRAMES"; fi
          CRF=20; if [ "$COMP" = "InventorWalkIn" ]; then CRF=18; fi
          npx remotion render src/index.ts "$COMP" "out/${COMP}.mp4" \
            --codec=h264 --crf=$CRF --gl=swangle $RANGE

      - name: Verify output (dimensions / fps / frame count)
        run: |
          npx remotion ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames,duration \
            -of default=noprint_wrappers=1 "out/${COMP}.mp4" | tee out/probe.txt
          test -s "out/${COMP}.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMP }}-${{ github.run_number }}
          path: |
            studio/out/*.mp4
            studio/out/stills/*.png
            studio/out/probe.txt
          retention-days: 14
          if-no-files-found: error
